<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration</h1>

    <form action="#" method="post">

        <div>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required minlength="3">
        </div>
        <br>
        <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        <br>
        <fieldset>
            <legend>Account Type</legend>
            
            <input type="radio" id="student" name="account_type" value="student" required>
            <label for="student">Student</label>

            <input type="radio" id="professional" name="account_type" value="professional">
            <label for="professional">Professional</label>
        </fieldset>
        <br>    
        <div>
            <label for="role">Field of Interest:</label>
            <select id="role" name="role" required>
                <option value="">Select an option</option>
                <option value="cybersecurity">Soc Analysis</option>
                <option value="development">Cloud Security</option>
                <option value="networking">Networking</option>
            </select>
        </div>
        <br>
        <div>
            <label for="bio">Biography:</label>
            <textarea id="bio" name="bio" rows="4" cols="30"></textarea>
        </div>
        <br>
        <div>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </div>
        
        <div>
            <button type="submit">Register</button>
        </div>

    </form>

</body>
</html>
