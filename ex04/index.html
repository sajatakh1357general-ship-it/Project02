<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 04 - The Box Model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CSS Box Model Comparison</h1>

  <div class="model-wrapper">
    <div class="box content-box">
      <h2>content-box</h2>
      <p>Declared width: 250px</p>
      <p>Padding: 25px | Border: 10px</p>
      <p class="result">Rendered Width = 320px</p>
    </div>

    <div class="box border-box">
      <h2>border-box</h2>
      <p>Declared width: 250px</p>
      <p>Padding: 25px | Border: 10px</p>
      <p class="result">Rendered Width = 250px</p>
    </div>
  </div>

</body>
</html>
